defaults:
  video: videos/example.mp4
  source_input_label: original
  coords_yaml: config/coords_800um.yaml
  preprocessing_method: none
  amplitude_uA: 60.0
  appearance_threshold_uA: 30.0
  frequency_hz: 300.0
  pulse_width_us: 170.0
  raster_mode: none
  internal_circuit_power_mw: 0.0
  ic_heat_mode: with

blocks:
  strategy_comparison:
    description: Compare stimulation strategies for one input video and electrode grid.
    run_id_template: "{preprocessing}__{raster}__{amplitude}"
    matrix:
      preprocessing:
        - label: none
          preprocessing_method: none
          source_input_label: original
        - label: dog
          preprocessing_method: dog
          source_input_label: dog
        - label: canny
          preprocessing_method: canny
          source_input_label: canny

      raster:
        - label: no_raster
          raster_mode: none
        - label: checkerboard
          raster_mode: checkerboard

      amplitude:
        - label: amp_30uA
          amplitude_uA: 30.0
          appearance_threshold_uA: 15.0
        - label: amp_60uA
          amplitude_uA: 60.0
          appearance_threshold_uA: 30.0
