defaults:
  video: videos/SANPO/SANPOcanny25min.mp4
  source_input_label: baseline
  coords_yaml: config/coords_800um.yaml
  preprocessing_method: canny
  amplitude_uA: 0.0
  appearance_threshold_uA: 0.0
  frequency_hz: 300.0
  pulse_width_us: 170.0
  raster_mode: none
  ic_heat_mode: with
  electrode_heat_enabled: false

blocks:
  ic_power:
    description: Measure grid-specific IC thermal linearity and validate additivity against phase 1 heating.
    run_id_template: "{grid}__ic_only__{ic_power}"
    matrix:
      grid:
        - label: coords_400um
          coords_yaml: config/coords_400um.yaml
          metadata:
            analysis_role: ic_only_fit
        - label: coords_800um
          coords_yaml: config/coords_800um.yaml
          metadata:
            analysis_role: ic_only_fit
        - label: coords_1200um
          coords_yaml: config/coords_1200um.yaml
          metadata:
            analysis_role: ic_only_fit

      ic_power:
        - label: 0mW
          internal_circuit_power_mw: 0.0
        - label: 5mW
          internal_circuit_power_mw: 5.0
        - label: 10mW
          internal_circuit_power_mw: 10.0
        - label: 20mW
          internal_circuit_power_mw: 20.0
        - label: 35mW
          internal_circuit_power_mw: 35.0
        - label: 50mW
          internal_circuit_power_mw: 50.0
        - label: 65mW
          internal_circuit_power_mw: 65.0

    cases:
      - run_id: coords_400um__canny__amp_120uA__5mW__additivity
        coords_yaml: config/coords_400um.yaml
        source_input_label: canny
        amplitude_uA: 120.0
        appearance_threshold_uA: 60.0
        internal_circuit_power_mw: 5.0
        electrode_heat_enabled: true
        metadata:
          analysis_role: additivity_validation
      - run_id: coords_400um__canny__amp_120uA__50mW__additivity
        coords_yaml: config/coords_400um.yaml
        source_input_label: canny
        amplitude_uA: 120.0
        appearance_threshold_uA: 60.0
        internal_circuit_power_mw: 50.0
        electrode_heat_enabled: true
        metadata:
          analysis_role: additivity_validation
      - run_id: coords_800um__canny__amp_120uA__5mW__additivity
        coords_yaml: config/coords_800um.yaml
        source_input_label: canny
        amplitude_uA: 120.0
        appearance_threshold_uA: 60.0
        internal_circuit_power_mw: 5.0
        electrode_heat_enabled: true
        metadata:
          analysis_role: additivity_validation
      - run_id: coords_800um__canny__amp_120uA__50mW__additivity
        coords_yaml: config/coords_800um.yaml
        source_input_label: canny
        amplitude_uA: 120.0
        appearance_threshold_uA: 60.0
        internal_circuit_power_mw: 50.0
        electrode_heat_enabled: true
        metadata:
          analysis_role: additivity_validation
      - run_id: coords_1200um__canny__amp_120uA__5mW__additivity
        coords_yaml: config/coords_1200um.yaml
        source_input_label: canny
        amplitude_uA: 120.0
        appearance_threshold_uA: 60.0
        internal_circuit_power_mw: 5.0
        electrode_heat_enabled: true
        metadata:
          analysis_role: additivity_validation
      - run_id: coords_1200um__canny__amp_120uA__50mW__additivity
        coords_yaml: config/coords_1200um.yaml
        source_input_label: canny
        amplitude_uA: 120.0
        appearance_threshold_uA: 60.0
        internal_circuit_power_mw: 50.0
        electrode_heat_enabled: true
        metadata:
          analysis_role: additivity_validation
