defaults:
  video: videos/SANPO/SANPOcanny25min.mp4
  source_input_label: canny
  coords_yaml: config/coords_400um.yaml
  preprocessing_method: canny
  amplitude_uA: 120.0
  appearance_threshold_uA: 60.0
  frequency_hz: 300.0
  pulse_width_us: 170.0
  internal_circuit_power_mw: 0.0
  ic_heat_mode: with
  electrode_heat_enabled: true

blocks:
  raster_protocols:
    description: Measure raster charge and thermal reductions against matched phase-1 baselines.
    matrices:
      - run_id_template: "screen__coords_400um__canny__amp_120uA__{raster_mode}__{raster_group}"
        matrix:
          raster_mode:
            - label: checkerboard
              raster_mode: checkerboard
              metadata:
                raster_pattern: checkerboard
            - label: pseudo_random
              raster_mode: pseudo_random
              metadata:
                raster_pattern: pseudo_random
          raster_group:
            - label: groups_3
              raster_groups: 3
              metadata:
                expected_duty_fraction: 0.3333333333333333
                expected_raster_cycle_rate_hz: 5.0
            - label: groups_4
              raster_groups: 4
              metadata:
                expected_duty_fraction: 0.25
                expected_raster_cycle_rate_hz: 3.75
            - label: groups_5
              raster_groups: 5
              metadata:
                expected_duty_fraction: 0.2
                expected_raster_cycle_rate_hz: 3.0
        metadata:
          analysis_role: worst_case_screen
          matched_phase1_run_id: coords_400um__canny__amp_120uA
          protocol_stage: screen

      - run_id_template: "transfer__{condition}__{raster_mode}__{raster_group}"
        matrix:
          condition:
            - label: coords_400um__canny__amp_60uA
              video: videos/SANPO/SANPOcanny25min.mp4
              source_input_label: canny
              coords_yaml: config/coords_400um.yaml
              preprocessing_method: canny
              amplitude_uA: 60.0
              appearance_threshold_uA: 30.0
              metadata:
                matched_phase1_run_id: coords_400um__canny__amp_60uA
            - label: coords_400um__dog__amp_120uA
              video: videos/SANPO/SANPOdog25min.mp4
              source_input_label: dog
              coords_yaml: config/coords_400um.yaml
              preprocessing_method: dog
              amplitude_uA: 120.0
              appearance_threshold_uA: 60.0
              metadata:
                matched_phase1_run_id: coords_400um__dog__amp_120uA
            - label: coords_400um__gt__amp_120uA
              video: videos/SANPO/SANPOgt25min.mp4
              source_input_label: gt
              coords_yaml: config/coords_400um.yaml
              preprocessing_method: groundtruth
              amplitude_uA: 120.0
              appearance_threshold_uA: 60.0
              metadata:
                matched_phase1_run_id: coords_400um__gt__amp_120uA
            - label: coords_800um__canny__amp_120uA
              video: videos/SANPO/SANPOcanny25min.mp4
              source_input_label: canny
              coords_yaml: config/coords_800um.yaml
              preprocessing_method: canny
              amplitude_uA: 120.0
              appearance_threshold_uA: 60.0
              metadata:
                matched_phase1_run_id: coords_800um__canny__amp_120uA
            - label: coords_1200um__canny__amp_120uA
              video: videos/SANPO/SANPOcanny25min.mp4
              source_input_label: canny
              coords_yaml: config/coords_1200um.yaml
              preprocessing_method: canny
              amplitude_uA: 120.0
              appearance_threshold_uA: 60.0
              metadata:
                matched_phase1_run_id: coords_1200um__canny__amp_120uA
          raster_mode:
            - label: checkerboard
              raster_mode: checkerboard
              metadata:
                raster_pattern: checkerboard
            - label: pseudo_random
              raster_mode: pseudo_random
              metadata:
                raster_pattern: pseudo_random
          raster_group:
            - label: groups_4
              raster_groups: 4
              metadata:
                expected_duty_fraction: 0.25
                expected_raster_cycle_rate_hz: 3.75
            - label: groups_5
              raster_groups: 5
              metadata:
                expected_duty_fraction: 0.2
                expected_raster_cycle_rate_hz: 3.0
        metadata:
          analysis_role: transfer_panel
          protocol_stage: transfer
