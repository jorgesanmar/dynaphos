        metadata.matched_phase1_run_id: phase1__011__protocol-amp_60uA__builtin-coords_400um__input-canny
        protocol:
          amplitude_uA: 60
          appearance_threshold_uA: 30
          pulse_width_us: 170
          frequency_hz: 300
