[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynaphos"
version = "0.1.3"
authors = [
  { name="Maureen van der Grinten", email="maureen.vandergrinten@ru.nl" },
  { name="Jaap de Ruyter", email="jaap.deruyter@donders.ru.nl" },
  { name="Bodo Rueckauer", email="bodo.rueckauer@donders.ru.nl" },
]
description = "Fully differentiable and biologically plausible simulation of prosthetic vision."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "PyYAML>=6.0",
    "scipy>=1.12",
    "torch>=2.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyter>=1.0",
    "pytest>=8.0",
]

[project.urls]
"Homepage" = "https://github.com/neuralcodinglab/dynaphos.git"

[project.scripts]
dynaphos = "dynaphos.cli:main"

[tool.setuptools.packages.find]
include = ["dynaphos*"]

[tool.setuptools.package-data]
dynaphos = [
  "data/defaults/*.yaml",
  "data/electrodes/*.yaml",
  "data/fixtures/*",
]
